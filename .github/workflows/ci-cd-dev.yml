name: AlgoRhythm Service CI/CD (dev)

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  PROJECT_ID: revize-453014
  SERVICE_NAME: algorhythm-service-dev
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: algorhythm
  IMAGE_NAME: service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Create Artifact Registry repository
        run: |
          gcloud artifacts repositories create ${{ env.REPOSITORY }} \
            --repository-format=docker \
            --location=us-central1 \
            --description="AlgoRhythm service Docker images" \
            --project=${{ env.PROJECT_ID }} 2>/dev/null || echo "Repository already exists"

      - name: Build Docker Image
        run: |
          echo "Building Docker image..."
          docker build \
            --tag ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --tag ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest \
            --build-arg NODE_ENV=production \
            .
          echo "✅ Docker image built successfully"

      - name: Push Docker Image
        run: |
          echo "Pushing Docker image to Artifact Registry..."
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
          echo "✅ Docker image pushed successfully"

      - name: Deploy to Cloud Run
        run: |
          echo "Deploying to Cloud Run..."
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-secrets="MONGODB_URI=algorhythm-mongodb-uri-dev:latest,REDIS_URL=algorhythm-redis-url-dev:latest,JWT_SECRET=algorhythm-jwt-secret-dev:latest,NNA_REGISTRY_JWT_SECRET=JWT_SECRET_DEV:latest,NNA_REGISTRY_URL=algorhythm-nna-registry-url-dev:latest,NNA_API_KEY=algorhythm-nna-api-key-dev:latest,NNA_REGISTRY_TIMEOUT=algorhythm-nna-registry-timeout-dev:latest" \
            --set-env-vars="NODE_ENV=development,LOG_LEVEL=info" \
            --timeout=300 \
            --memory=1Gi \
            --cpu=1 \
            --max-instances=10 \
            --min-instances=0 \
            --project=${{ env.PROJECT_ID }}

      - name: Verify secret binding (NNA_REGISTRY_JWT_SECRET)
        run: |
          REVISION=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} \
            --format='value(status.latestReadyRevisionName)')
          echo "Latest ready revision: $REVISION"
          ENV_YAML=$(gcloud run revisions describe "$REVISION" --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} --format='yaml(spec.containers[0].env)')
          echo "$ENV_YAML" | grep -q "NNA_REGISTRY_JWT_SECRET" || { echo "Missing NNA_REGISTRY_JWT_SECRET on revision $REVISION"; exit 1; }
          echo "✅ NNA_REGISTRY_JWT_SECRET is bound on $REVISION"

      - name: Post-deploy smoke test (variations)
        env:
          API_KEY: reviz-dev-30390-13220-4896-9516-9001
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} --format='value(status.url)' --project=${{ env.PROJECT_ID }})
          echo "Service URL: $SERVICE_URL"
          # 1) Component IDs path
          RES=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$SERVICE_URL/api/v1/reviz/composite/variations" \
            -H "x-api-key: $API_KEY" -H "Content-Type: application/json" \
            -d '{"composite_id":"1.018.003.002+2.009.001.001+3.003.010.002+4.022.002.008+5.015.001.003","vary_layers":["stars","looks","moves","worlds"],"assets_per_layer":2}')
          echo "Smoke test (components) HTTP: $RES"
          [ "$RES" = "200" ] || { echo "Smoke test failed for components path"; exit 1; }
          # 2) Known composite HFN path
          RES2=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$SERVICE_URL/api/v1/reviz/composite/variations" \
            -H "x-api-key: $API_KEY" -H "Content-Type: application/json" \
            -d '{"composite_id":"9.002.025.082","vary_layers":["stars","looks","moves","worlds"],"assets_per_layer":2}')
          echo "Smoke test (hfn) HTTP: $RES2"
          [ "$RES2" = "200" ] || { echo "Smoke test failed for HFN path"; exit 1; }
          echo "✅ Smoke tests passed"

      - name: Post-deploy health check
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format='value(status.url)' \
            --project=${{ env.PROJECT_ID }})
          
          echo "Checking health endpoint: $SERVICE_URL/api/health"
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/api/health")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed."
              break
            fi
            echo "Waiting for service to become healthy... ($i/10)"
            sleep 6
          done

      - name: Output Development URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format='value(status.url)' \
            --project=${{ env.PROJECT_ID }})
          
          echo "================================================"
          echo "✅ DEPLOYMENT SUCCESSFUL!"
          echo "================================================"
          echo "🚀 Service URL: $SERVICE_URL"
          echo "🏥 Health Check: $SERVICE_URL/api/health"
          echo "📊 Cloud Console: https://console.cloud.google.com/run/detail/${{ env.REGION }}/${{ env.SERVICE_NAME }}?project=${{ env.PROJECT_ID }}"
          echo "================================================"
