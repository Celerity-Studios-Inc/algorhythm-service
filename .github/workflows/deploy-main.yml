name: AlgoRhythm Service CI/CD (Development)

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install --legacy-peer-deps
      
    - name: Build application
      run: npm run build
      
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        
    - name: Authenticate Docker
      run: |
        gcloud auth configure-docker us-central1-docker.pkg.dev
        gcloud auth configure-docker gcr.io
      
    - name: Use simple working files
      run: |
        cp Dockerfile.simple Dockerfile
        cp .dockerignore.simple .dockerignore
        
    - name: Build Docker image
      run: |
        IMAGE_TAG="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/algorhythm-repo/algorhythm-service-dev:${{ github.sha }}"
        docker build --platform linux/amd64 --no-cache -t $IMAGE_TAG .
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
        
    - name: Push Docker image
      run: |
        docker push ${{ env.IMAGE_TAG }}
        
    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy algorhythm-service-dev \
          --image ${{ env.IMAGE_TAG }} \
          --platform managed \
          --region us-central1 \
          --allow-unauthenticated \
          --port 8080 \
          --memory 2Gi \
          --cpu 2 \
          --timeout 300 \
          --concurrency 100 \
          --max-instances 10 \
          --min-instances 0
