name: AlgoRhythm Service CI/CD (Staging)

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm test -- --passWithNoTests

      - name: Build Docker image
        env:
          IMAGE_TAG: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/algorhythm-repo/algorhythm-service-staging:${{ github.sha }}-${{ github.run_id }}-stg
        run: docker build --platform linux/amd64 --no-cache -t $IMAGE_TAG -f docker/Dockerfile.cloudrun .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Google Cloud
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Push Docker image
        env:
          IMAGE_TAG: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/algorhythm-repo/algorhythm-service-staging:${{ github.sha }}-${{ github.run_id }}-stg
        run: docker push $IMAGE_TAG

      - name: Deploy to Cloud Run
        env:
          IMAGE_TAG: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/algorhythm-repo/algorhythm-service-staging:${{ github.sha }}-${{ github.run_id }}-stg
        run: |
          gcloud run deploy algorhythm-service-staging \
            --image $IMAGE_TAG \
            --region us-central1 \
            --platform managed \
            --execution-environment=gen2 \
            --service-account=ci-cd-service-account@revize-453014.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --port 8080 \
            --memory 2Gi \
            --cpu 2 \
            --max-instances 20 \
            --min-instances 2 \
            --concurrency 100 \
            --timeout 300 \
            --set-secrets=MONGODB_URI=algorhythm-mongodb-uri-stg:latest \
            --set-secrets=REDIS_URL=algorhythm-redis-url-stg:latest \
            --set-secrets=JWT_SECRET=algorhythm-jwt-secret-stg:latest \
            --set-secrets=NNA_REGISTRY_JWT_SECRET=JWT_SECRET_STG:latest \
            --set-secrets=NNA_REGISTRY_API_KEY=algorhythm-nna-api-key-stg:latest \
            --set-secrets=WEBHOOK_SECRET=algorhythm-webhook-secret-stg:latest \
            --set-secrets=ALGORHYTHM_WEBHOOK_SECRET=algorhythm-webhook-secret-stg:latest \
            --set-secrets=ALGORHYTHM_WEBHOOK_URL=algorhythm-webhook-url-stg:latest \
            --set-secrets=ALGORHYTHM_WEBHOOK_MAX_RETRIES=algorhythm-webhook-max-retries-stg:latest \
            --set-secrets=ALGORHYTHM_WEBHOOK_RETRY_DELAY=algorhythm-webhook-retry-delay-stg:latest \
            --set-secrets=REVIZ_API_KEY=algorhythm-reviz-api-key-stg:latest \
                        --set-env-vars "NODE_ENV=staging,ENVIRONMENT=staging,NNA_REGISTRY_BASE_URL=https://registry.stg.reviz.dev,ALGORHYTHM_BASE_URL=https://stg.algorhythm.media"

      - name: Verify secret binding (NNA_REGISTRY_JWT_SECRET)
        run: |
          REVISION=$(gcloud run services describe algorhythm-service-staging --region us-central1 --format='value(status.latestReadyRevisionName)')
          echo "Latest ready revision (staging): $REVISION"
          ENV_YAML=$(gcloud run revisions describe "$REVISION" --region us-central1 --format='yaml(spec.containers[0].env)')
          echo "$ENV_YAML" | grep -q "NNA_REGISTRY_JWT_SECRET" || { echo "Missing NNA_REGISTRY_JWT_SECRET on $REVISION"; exit 1; }
          echo "✅ NNA_REGISTRY_JWT_SECRET bound on $REVISION"

      - name: Post-deploy smoke test (staging variations)
        run: |
          SERVICE_URL=$(gcloud run services describe algorhythm-service-staging --region us-central1 --format='value(status.url)')
          echo "Service URL: $SERVICE_URL"
          # Get API key from Secret Manager
          API_KEY=$(gcloud secrets versions access latest --secret algorhythm-reviz-api-key-stg)
          # 1) Component IDs
          RES=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$SERVICE_URL/api/v1/reviz/composite/variations" \
            -H "x-api-key: $API_KEY" -H "Content-Type: application/json" \
            -d '{"composite_id":"1.018.003.002+2.009.001.001+3.003.010.002+4.022.002.008+5.015.001.003","vary_layers":["stars","looks","moves","worlds"],"assets_per_layer":2}')
          echo "Smoke (components) HTTP: $RES"
          [ "$RES" = "200" ] || { echo "Smoke test failed (components)"; exit 1; }
          # 2) HFN
          RES2=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$SERVICE_URL/api/v1/reviz/composite/variations" \
            -H "x-api-key: $API_KEY" -H "Content-Type: application/json" \
            -d '{"composite_id":"9.002.025.082","vary_layers":["stars","looks","moves","worlds"],"assets_per_layer":2}')
          echo "Smoke (hfn) HTTP: $RES2"
          [ "$RES2" = "200" ] || { echo "Smoke test failed (hfn)"; exit 1; }
          echo "✅ Staging smoke tests passed"

      - name: Update Traffic to Latest Revision
        run: |
          gcloud run services update-traffic algorhythm-service-staging \
            --region us-central1 \
            --to-latest

      - name: Post-deploy health check
        run: |
          SERVICE_URL=$(gcloud run services describe algorhythm-service-staging --region us-central1 --format='value(status.url)')
          echo "Checking health endpoint: $SERVICE_URL/api/v1/health"
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/api/v1/health")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi
            echo "Waiting for service to become healthy... ($i/10)"
            sleep 6
          done
          echo "Health check failed!"
          exit 1

      - name: Output Staging URL
        run: |
          SERVICE_URL=$(gcloud run services describe algorhythm-service-staging --region us-central1 --format='value(status.url)')
          echo "🌐 AlgoRhythm Staging Service URL: $SERVICE_URL"
          echo "📚 Swagger Docs: $SERVICE_URL/api/docs"
          echo "🏥 Health Check: $SERVICE_URL/api/v1/health"
