name: Setup Webhook Secrets

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to setup secrets for'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stg
          - prod

jobs:
  setup-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Generate Webhook Secret
        id: generate-secret
        run: |
          WEBHOOK_SECRET=$(openssl rand -hex 32)
          echo "WEBHOOK_SECRET=${WEBHOOK_SECRET}" >> $GITHUB_OUTPUT
          echo "Generated webhook secret: ${WEBHOOK_SECRET}"

      - name: Create Google Cloud Secrets
        run: |
          # Create webhook secret
          echo -n "${{ steps.generate-secret.outputs.WEBHOOK_SECRET }}" | gcloud secrets create algorhythm-webhook-secret \
            --data-file=- \
            --labels=environment=${{ github.event.inputs.environment }},service=algorhythm,type=webhook \
            --replication-policy=automatic || echo "Secret already exists"

          # Create NNA Registry webhook URL
          echo -n "https://registry.${{ github.event.inputs.environment }}.reviz.dev/webhooks" | gcloud secrets create nna-registry-webhook-url \
            --data-file=- \
            --labels=environment=${{ github.event.inputs.environment }},service=algorhythm,type=webhook-url \
            --replication-policy=automatic || echo "Secret already exists"

      - name: Update GitHub Repository Secrets
        run: |
          # Note: This would require additional permissions to update repository secrets
          echo "Webhook secret generated: ${{ steps.generate-secret.outputs.WEBHOOK_SECRET }}"
          echo "Please manually add this secret to GitHub repository secrets:"
          echo "WEBHOOK_SECRET=${{ steps.generate-secret.outputs.WEBHOOK_SECRET }}"
